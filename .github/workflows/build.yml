name: Build GDExtension

# Builds the Linux (.so) and macOS (.dylib) MiniAudio binaries that only the
# Windows DLLs had been rebuilt for. godot-cpp is a sibling checkout here
# (the SConstruct expects ../godot-cpp), so it is cloned before building.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix-utf8-device-names
      - ci-crossplatform-build
    paths:
      - "MiniAudioMic/**"
      - ".github/workflows/build.yml"

env:
  GODOT_CPP_REPO: https://github.com/godotengine/godot-cpp.git
  GODOT_CPP_REF: "4.5"

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SCons and ALSA headers
        run: |
          python3 -m pip install --upgrade scons
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Fetch godot-cpp
        run: git clone --depth 1 --branch "$GODOT_CPP_REF" "$GODOT_CPP_REPO" godot-cpp

      - name: Build godot-cpp
        working-directory: godot-cpp
        run: |
          scons platform=linux target=template_debug arch=x86_64 -j"$(nproc)"
          scons platform=linux target=template_release arch=x86_64 -j"$(nproc)"

      - name: Build MiniAudio
        working-directory: MiniAudioMic
        run: |
          scons platform=linux build=debug -j"$(nproc)"
          scons platform=linux build=release -j"$(nproc)"

      - name: Show results
        run: |
          ls -l MiniAudioMic/bin/linux/
          file MiniAudioMic/bin/linux/*.so

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MiniAudio-linux-x86_64
          path: MiniAudioMic/bin/linux/*.so
          if-no-files-found: error

  macos:
    name: macOS universal
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SCons
        run: python3 -m pip install --upgrade scons

      - name: Fetch godot-cpp
        run: git clone --depth 1 --branch "$GODOT_CPP_REF" "$GODOT_CPP_REPO" godot-cpp

      - name: Build godot-cpp
        working-directory: godot-cpp
        run: |
          scons platform=macos target=template_debug arch=universal -j"$(sysctl -n hw.logicalcpu)"
          scons platform=macos target=template_release arch=universal -j"$(sysctl -n hw.logicalcpu)"

      - name: Build MiniAudio
        working-directory: MiniAudioMic
        run: |
          scons platform=macos build=debug arch=universal -j"$(sysctl -n hw.logicalcpu)"
          scons platform=macos build=release arch=universal -j"$(sysctl -n hw.logicalcpu)"

      - name: Show results
        run: |
          ls -l MiniAudioMic/bin/macos/
          lipo -info MiniAudioMic/bin/macos/*.dylib

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MiniAudio-macos-universal
          path: MiniAudioMic/bin/macos/*.dylib
          if-no-files-found: error
